<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Support Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 52px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      text-align: center;
    }
    .logo { font-size: 44px; margin-bottom: 12px; }
    h1   { font-size: 26px; color: #1a1a1a; margin-bottom: 6px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 36px; }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 13px 20px;
      background: white; border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      text-decoration: none; color: #1a1a1a;
      transition: all 0.2s ease;
    }
    .google-btn:hover {
      border-color: #667eea;
      box-shadow: 0 6px 20px rgba(102,126,234,.2);
      transform: translateY(-1px);
    }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .footer { margin-top: 28px; font-size: 12px; color: #bbb; }
    .error {
      background: #fff0f0; border: 1px solid #ffcccc; color: #c33;
      padding: 10px 14px; border-radius: 4px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h1>Support Portal</h1>
    <p class="sub">Sign in to continue</p>

    <div id="error" class="error"></div>

    <a href="/auth/google" class="google-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div class="footer">By signing in you agree to our Terms &amp; Privacy Policy</div>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    if (p.has("error")) {
      const el = document.getElementById("error");
      el.textContent = p.get("error_description") || "Authentication failed. Please try again.";
      el.classList.add("show");
    }
  </script>
</body>
</html>
