<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zendesk Support</title>
</head>

<body>
  <h1>Support Page</h1>
  <p>Click on the chat widget to talk with us.</p>

  <!-- Step 1: Zendesk Script -->
  <script id="ze-snippet"
    src="https://static.zdassets.com/ekr/snippet.js?key=4200724f-94bb-4a43-b68b-4f8cc65407bc">
  </script>

  <script>
    window.addEventListener("load", function () {

      if (typeof zE === "undefined") {
        console.log("Zendesk NOT loaded ❌");
        return;
      }

      // Widget open event
      zE('messenger:on', 'open', function () {
        console.log("Widget Opened 🚀");
      });

      // Widget close event
      zE('messenger:on', 'close', function () {
        console.log("Widget Closed ❌");
      });

    });
  </script>

</body>
</html>
